# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore ./WrapperNetPOI/WrapperNetPOI.csproj
    - name: Build
      run: dotnet build ./WrapperNetPOI/WrapperNetPOI.csproj --no-restore
    - name: Test
      run: dotnet test ./WrapperNetPOI/WrapperNetPOI.csproj --no-build --verbosity normal
    - name: Build Release
      run: dotnet build ./WrapperNetPOI/WrapperNetPOI.csproj -c Release --no-restore
    - name: Generate NuGet package
      run: dotnet pack ./WrapperNetPOI/WrapperNetPOI.csproj -c Release --output ./WrapperNetPOI/nuget/
    - name: Check created packages
      run: |
        echo "Созданные пакеты:"
        Get-ChildItem -Path ./WrapperNetPOI/nuget/ -Filter *.nupkg
    - name: Push to NuGet
      run: |
        $files = Get-ChildItem -Path ./WrapperNetPOI/nuget/ -Filter *.nupkg
        foreach ($file in $files) {
          dotnet nuget push $file.FullName `
            --api-key ${{ secrets.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate `
            --no-symbols
        }

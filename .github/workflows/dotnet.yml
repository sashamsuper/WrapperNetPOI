# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore ./WrapperNetPOI/WrapperNetPOI.csproj
    - name: Build
      run: dotnet build ./WrapperNetPOI/WrapperNetPOI.csproj --no-restore
    - name: Test
      run: dotnet test ./WrapperNetPOI/WrapperNetPOI.csproj --no-build --verbosity normal
    - name: Build Release
      run: dotnet build ./WrapperNetPOI/WrapperNetPOI.csproj -c Release --no-restore
    - name: Generate NuGet package
      run: dotnet pack ./WrapperNetPOI/WrapperNetPOI.csproj -c Release -o nuget
    - name: Push the package to NuGet
      run: dotnet nuget push ./nuget/*.nupkg --api-key ${{ secrets.NUGET_KEY_REPR }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
